            </div>

            <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-asianRed text-white shadow-md">
                <span data-i18n="cat_all">Всё меню</span>
            </button>
            <button onclick="filterCategory('starters')" id="cat-starters" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800">

            </button>

        let activeCategory = 'all';

        function renderDishes() {
            const grid = document.getElementById('dishesGrid');
            const noResults = document.getElementById('noResults');
            const query = document.getElementById('searchInput').value.toLowerCase();

            grid.innerHTML = '';

            const filtered = dishes.filter(dish => {
                const matchesCat = activeCategory === 'all' || dish.category === activeCategory;
                const name = dish.name[currentLang].toLowerCase();
                const desc = dish.desc[currentLang].toLowerCase();
                const ingredients = dish.ingredients[currentLang].join(' ').toLowerCase();
                return matchesCat && (name.includes(query) || desc.includes(query) || ingredients.includes(query));
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(dish => {
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-gray-800 rounded-2xl overflow-hidden hover:border-asianRed/50 transition-all duration-300 flex flex-col justify-between shadow-lg group cursor-pointer';
                card.onclick = () => openDishModal(dish.id);

                card.innerHTML = `
                    <div>
                        <div class="relative h-48 w-full overflow-hidden">
                            <img src="${dish.image}" alt="${dish.name[currentLang]}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-transparent"></div>
                            <div class="absolute top-3 left-3 flex gap-1.5">
                                <span class="px-2.5 py-1 bg-black/70 backdrop-blur-md text-asianGold text-[10px] font-bold rounded-lg border border-asianGold/30 shadow">${dish.badge[currentLang]}</span>
                            </div>
                            <div class="absolute top-3 right-3">
                                <span class="px-2.5 py-1 bg-black/70 backdrop-blur-md text-white text-xs font-mono rounded-lg border border-gray-700">${dish.weight}</span>
                            </div>
                        </div>
                        <div class="p-5">
                            <h3 class="text-lg font-serif font-bold text-white mb-1.5 group-hover:text-asianGold transition-colors">${dish.name[currentLang]}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2 mb-4 leading-relaxed">${dish.desc[currentLang]}</p>
                            <div class="flex flex-wrap gap-1 mb-2">
                                ${dish.ingredients[currentLang].slice(0, 3).map(ing => `<span class="text-[10px] bg-darkBg text-gray-300 px-2 py-0.5 rounded border border-gray-800">${ing}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-gray-800/60 mt-auto">
                        <span class="text-xs text-gray-500 italic">Нажмите для деталей</span>
                        <span class="text-lg font-bold text-asianGold">${dish.price}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-cardBg text-gray-300 hover:bg-cardHover border border-gray-800";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all bg-asianRed text-white shadow-md";
            }
            renderDishes();
        }

        function filterDishes() { renderDishes(); }

        function setLang(lang) {
            currentLang = lang;
            ['ru', 'kz', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "px-2.5 py-1 rounded-full transition-all bg-asianRed text-white font-semibold";
                } else {
                    btn.className = "px-2.5 py-1 rounded-full transition-all text-gray-400 hover:text-white";
                }
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            renderDishes();
        }

        function openDishModal(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;

            document.getElementById('modalImg').src = dish.image;
            document.getElementById('modalBadge').innerText = dish.badge[currentLang];
            document.getElementById('modalTitle').innerText = dish.name[currentLang];
            document.getElementById('modalWeight').innerText = dish.weight;
            document.getElementById('modalDesc').innerText = dish.desc[currentLang];
            document.getElementById('modalPrice').innerText = dish.price;

            const ingContainer = document.getElementById('modalIngredients');
            ingContainer.innerHTML = dish.ingredients[currentLang].map(ing => `<span class="text-xs bg-darkBg text-asianGold px-2.5 py-1 rounded-lg border border-gray-800">${ing}</span>`).join('');

            document.getElementById('dishModal').classList.remove('hidden');
        }

        function closeDishModal() { document.getElementById('dishModal').classList.add('hidden'); }

        let qrInstance = null;
        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            if (!qrInstance) {
                qrInstance = new QRious({
                    element: document.getElementById('qrcodeCanvas'),
                    value: window.location.href,
                    size: 180,
                    level: 'H',
                    background: '#ffffff',
                    foreground: '#0D0F12'
                });
            }
        }

        function closeQRModal() { document.getElementById('qrModal').classList.add('hidden'); }

        function downloadQR() {
            const canvas = document.getElementById('qrcodeCanvas');
            const link = document.createElement('a');
            link.download = 'prokap-menu-qr.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function openBookingModal() { document.getElementById('bookingModal').classList.remove('hidden'); }
        function closeBookingModal() { document.getElementById('bookingModal').classList.add('hidden'); }

        function handleBooking(e) {
            e.preventDefault();
            closeBookingModal();
            showToast(translations[currentLang].booking_success);
        }

        function callWaiter() { showToast(translations[currentLang].waiter_called); }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = text;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        window.onload = () => {
            renderDishes();
            lucide.createIcons();
        };
    </script>
